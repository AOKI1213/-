<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Binder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <div class="nav">
      <a class="btn" href="index.html">← Back</a>
      <span class="btn" style="pointer-events:none;">⚪ White Binder</span>
    </div>

    <div class="gallery" id="gallery"></div>

  </div>

<script>
const gallery = document.getElementById("gallery");

// 1～64ページ（※64枚なら <= 64 にする）
for (let i = 1; i <= 64; i++) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <img src="white/page ${i} of the white binder.jpg" loading="lazy">
    <div class="meta">page ${i} of the white binder</div>
  `;
  gallery.appendChild(div);
}
</script>

</body>
</html>
