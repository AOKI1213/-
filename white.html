<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>White Binder</title>

<style>
body{padding:8px}

.card{
 margin-bottom:12px;
}

.card img{
 width:100%;
}

.title{
 padding:6px;
 font-size:14px;
}
</style>

</head>

<body>

<a href="index.html">← back</a>

<h2>White Binder</h2>

<div class="gallery" id="gallery"></div>

<script>
const gallery = document.getElementById("gallery");

// 1～65ページを自動生成
for (let i = 1; i <= 65; i++) {

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="white/page ${i} of the white binder.jpg">
    <div class="title">page ${i} of the white binder</div>
  `;

  gallery.appendChild(div);
}
</script>

</body>
</html>
