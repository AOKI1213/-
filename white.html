<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray Binder</title>

<style>
body{
  font-family:sans-serif;
  padding:16px;
  background:#fafafa;
}

a{
  text-decoration:none;
  color:#000;
}

.card{
  margin-bottom:18px;
}

.card img{
  width:100%;
  border-radius:10px;
}

.title{
  font-size:13px;
  color:#666;
  margin-top:6px;
}
</style>
</head>

<body>

<a href="index.html">← Back</a>
<h2>Gray Binder</h2>

<div id="gallery"></div>

<script>
const gallery = document.getElementById("gallery");

for(let i=1;i<=64;i++){
  gallery.innerHTML += `
    <div class="card">
      <img src="gray/page ${i} of the gray binder.jpg">
      <div class="title">Gray Binder • Page ${i}</div>
    </div>
  `;
}
</script>

</body>
</html>
