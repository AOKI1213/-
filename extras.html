<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Collection</title>

<style>
body{
  font-family:sans-serif;
  padding:20px;
  background:#fafafa;
}

a{
  text-decoration:none;
  color:#333;
}

h1{
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}

.card{
  background:#fff;
  padding:10px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.card img{
  width:100%;
  border-radius:8px;
}
</style>
</head>

<body>

<a href="index.html">← Back</a>

<h1>Special Collection</h1>
<p>Cards not currently in binders.</p>

<div class="grid">

  <div class="card">
    <img src="extras/extras_01.JPG">
  </div>

</div>

</body>
</html>
