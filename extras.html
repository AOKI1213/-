<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extras (Not in Binder)</title>
  <link rel="stylesheet" href="style.css">

  <!-- Google tag (gtag.js) ※他ページと同じなら入れてOK -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FQJ32PYV9G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FQJ32PYV9G');

  <style>
    /* ページ内だけ少し整える（シンプル） */
    .wrap{ max-width: 720px; margin: 0 auto; padding: 16px; }
    .back{ display:inline-block; margin: 4px 0 14px; text-decoration:none; color:#333; }
    h2{ margin: 0 0 6px; }
    .desc{ margin: 0 0 14px; color:#666; font-size:14px; line-height:1.4; }
    .photo{
      background:#fff;
      border:1px solid #eee;
      border-radius:12px;
      padding:12px;
      margin-bottom:14px;
    }
    .photo img{ width:100%; border-radius:10px; display:block; }
    .cap{ margin-top:10px; font-size:13px; color:#444; font-weight:600; }
    .note{ margin-top:4px; font-size:12px; color:#777; line-height:1.4; }
  </style>
</head>

<body>
  <div class="wrap">
    <a class="back" href="index.html">← back</a>

    <h2>Extras (Not in Binder)</h2>
    <p class="desc">Cards that aren’t currently stored in the binders.</p>

    <div class="photo">
      <img src="extras/extras_01.jpg" alt="Extras cards photo">
      <div class="cap">Extras photo</div>
      <div class="note">If you’d like close-ups, tell me which card(s).</div>
    </div>

    <!-- 画像を増やすならこれをコピペして増やす
    <div class="photo">
      <img src="extras/extras_02.jpg" alt="Extras cards photo 2">

    -->

  </div>
