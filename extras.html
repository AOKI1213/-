<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Collection</title>

<style>
body{
  font-family:sans-serif;
  padding:20px;
  background:#fafafa;
  margin:0;
}

.back{
  text-decoration:none;
  color:#333;
  display:inline-block;
  margin-bottom:20px;
}

h1{
  margin:0 0 6px;
}

.desc{
  color:#666;
  font-size:14px;
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

.card img{
  width:100%;
  border-radius:10px;
  display:block;
}
</style>
</head>

<body>

<a class="back" href="index.html">← Back</a>

<h1>Special Collection</h1>
<p class="desc">Cards not currently in binders.</p>

<div class="grid">

  <div class="card">
    <!-- 実際のファイル名に完全一致させる -->
    <img src="extras/extras_01.JPG" alt="Special collection cards">
  </div>

</div>

</body>
</html>
