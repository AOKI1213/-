<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Orange Binder</title>

<style>
body{
  padding:12px;
  font-family:sans-serif;
  background:#fafafa;
}

a.back{
  display:inline-block;
  margin-bottom:12px;
  text-decoration:none;
  color:#333;
}

h2{
  margin-bottom:16px;
}

.card{
  margin-bottom:16px;
  background:#fff;
  padding:10px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:8px;
}

.page{
  font-size:13px;
  margin-top:6px;
  color:#555;
  font-weight:600;
}
</style>

</head>

<body>

<a class="back" href="index.html">← back</a>

<h2>Orange Binder</h2>

<div id="gallery"></div>

<script>

const gallery = document.getElementById("gallery");

// 🔶 1〜64ページ自動生成
for (let i = 1; i <= 64; i++) {

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="orange/page ${i} of the orange binder.jpg" alt="">
    <div class="page">Orange Binder / Page ${i}</div>
  `;

  gallery.appendChild(div);
}

</script>

</body>
</html>
