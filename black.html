<title>Black Binder</title>

<style>
body{
  font-family:sans-serif;
  padding:16px;
  background:#fafafa;
}

a.back{
  display:inline-block;
  margin-bottom:12px;
  text-decoration:none;
  color:#333;
}

h2{
  margin-bottom:16px;
}

.card{
  background:#fff;
  padding:12px;
  margin-bottom:14px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.card img{
  width:100%;
  border-radius:8px;
}

.title{
  margin-top:8px;
  font-size:14px;
  font-weight:600;
}
</style>

</head>

<body>

<a class="back" href="index.html">← back</a>

<h2>Black Binder</h2>

<div id="gallery"></div>

<script>
const gallery = document.getElementById("gallery");

// ★ ブラックは 1〜49ページ
for (let i = 1; i <= 49; i++) {

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="black/page ${i} of the black binder.jpg" alt="">
    <div class="title">Page ${i}</div>
  `;

  gallery.appendChild(div);
}
</script>

</body>
