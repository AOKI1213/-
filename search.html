<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Card Search</title>

<style>
body{
  font-family:sans-serif;
  padding:16px;
  background:#fafafa;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  margin-bottom:16px;
}

.card{
  background:#fff;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
}

.card img{
  width:100%;
}
</style>

</head>

<body>

<h2>Search Cards</h2>

<input id="search" placeholder="Mewtwo / Arceus / Charizard...">

<div id="result"></div>

<script>

const pages = [
  {
    image: "yellow/58.jpg",
    cards: [
      
      "mewtwo",

  
    ]
  }
];

document.getElementById("search").addEventListener("input", e => {

  const word = e.target.value.toLowerCase();
  const result = document.getElementById("result");

  result.innerHTML = "";

  pages.forEach(p => {

    const hit = p.cards.some(c =>
      c.toLowerCase().includes(word)
    );

    if(hit){
      result.innerHTML += `
        <div class="card">
          <img src="${p.image}">
          <div>Matched Page</div>
        </div>
      `;
    }

  });

});

</script>

</body>
</html>
