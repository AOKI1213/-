// ---------------------------
// Search UI
// ---------------------------
document.getElementById("search").addEventListener("input", (e) => {
  const word = e.target.value.trim();
  const result = document.getElementById("result");

  result.innerHTML = "";
  if(!word) return;

  const key = normalize(word);

  pages.forEach(p => {
    const hit = p.cards.some(c => normalize(c).includes(key));
    if(hit){
      result.innerHTML += `
        <div class="card">
          <img src="${p.image}" alt="">
          <div class="meta">${p.binder} / Page ${p.page}</div>
          <div class="tag">${p.cards.join(", ")}</div>
        </div>
      `;
    }
  });
});
