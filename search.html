document.getElementById("search").addEventListener("input", e => {

 const word = e.target.value.toLowerCase();
 const result = document.getElementById("result");

 result.innerHTML = "";

 if(!word) return;

 pages.forEach(p => {

   const hit = p.cards.some(c =>
     c.includes(word)
   );

   if(hit){
     result.innerHTML += `
       <div class="card">
         <img src="${p.image}">
         <div class="tag">${p.cards.join(", ")}</div>
       </div>
     `;
   }

 });

});
