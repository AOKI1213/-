<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Search</title>

<style>
body{
  font-family:sans-serif;
  padding:16px;
  background:#fafafa;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  margin-bottom:16px;
  border-radius:8px;
  border:1px solid #ddd;
}

.card{
  background:#fff;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:8px;
}

.tag{
  font-size:13px;
  color:#666;
  margin-top:6px;
  line-height:1.4;
}

.tag b{
  color:#111;
}
</style>
</head>

<body>

<h2>Search Cards</h2>
<input id="search" placeholder="Enter the name of the Pokémon">

<div id="result"></div>

<script>

// ---------------------------
// Yellow Binder (1〜56)
// ---------------------------
const yellowData = [
["gengar"],
["charizard"],
["gardevoir"],
["lucario"],
["dragonite"],
["abomasnow"],
["diancie"],
["eelektross"],
["hawlucha"],
["scrafty"],
["audino","rayquaza","kangaskhan"],
["tyranitar","manectric","altaria","houndoom"],
["heracross","alakazam","glalie","lucario"],
["sharpedo","mawile","blastoise","venusaur"],
["diancie","slowbro","sceptile","camerupt"],
["aggron","aerodactyl","latios","steelix"],
["gyarados","ampharos","metagross","scizor"],
["gallade","gardevoir","salamence"],
["mewtwo","gyarados","kingdra"],
["tentacruel","gyarados","lapras","feraligatr"],
["feraligatr","poliwrath","blastoise","golduck","gyarados"],
["articuno","vaporeon","blastoise"],
["gyarados","kabutops","entei","ninetales","arcanine","moltres"],
["flareon","entei","hooh","chansey","clefairy"],
["snorlax","clefable","pidgeot","dragonite","lugia","persian"],
["ditto","delibird","porygon","wigglytuff","clefable","snorlax","aerodactyl","machamp"],
["dugtrio","rhydon","machamp","kabutops","donphan","hitmonlee"],
["raichu","zapdos","ampharos","magneton","raikou"],
["magneton","electrode","raichu","pichu","jolteon"],
["pichu","pinsir","celebi","venusaur","vileplume","heracross","bellossom","nidoking"],
["jumpluff","nidoqueen","arbok","venusaur","muk"],
["crobat","jumpluff","weezing"],
["vileplume","golbat","venusaur","meganium"],
["meganium","crobat","victreebel","nidoking","venomoth","scyther","wobbuffet"],
["alakazam","starmie","slowbro","hypno","mr mime"],
["hypno","alakazam","mew","mewtwo"],
["slowking","mew","haunter","mr mime","alakazam","misdreavus","charizard"],
["charizard","gengar"],
["gengar"],
["gengar"],
["gengar","dragonite"],
["dragonite","lucario"],
["lucario"],
["lucario","gardevoir"],
["gardevoir"],
["gardevoir"],
["gardevoir","abomasnow"],
["abomasnow","diancie"],
["diancie"],
["eelektross"],
["eelektross","scrafty"],
["scrafty"],
["scrafty","hawlucha"],
["hawlucha"],
["gardevoir","mawile","pikachu","mew","charizard","meowth","garchomp","gyarados"],
["latias","latios","greninja","zoroark","magikarp","wailord","lucario","melmetal"],
["moltres","zapdos","articuno","reshiram","zekrom","lucario","melmetal","arceus","dialga","palkia","marshadow","machamp"],
["reshiram","charizard","togepi","eevee","snorlax"],
["pheromosa","buzzwole","garchomp","giratina"],
["garchomp","giratina","arceus","dialga","palkia","muk","charizard","keldeo","mewtwo","moltres"]
];

// ---------------------------
// Build pages array
// ---------------------------
const pages = [];

// Yellow
yellowData.forEach((cards,index)=>{
  pages.push({
    binder:"Yellow Binder",
    page:index+1,
    image:`yellow/${91-index}_IMG_0${228+index}.jpg`,
    cards:cards
  });
});

// ---------------------------
// Search
// ---------------------------
document.getElementById("search").addEventListener("input", e => {

  const word = e.target.value.toLowerCase().trim();
  const result = document.getElementById("result");
  result.innerHTML = "";
  if(!word) return;

  const normalize = (s)=> s.toLowerCase().replace(/\s+/g,"");

  pages.forEach(p=>{
    const hit = p.cards.some(c=> normalize(c).includes(normalize(word)));
    if(hit){
      result.innerHTML += `
        <div class="card">
          <img src="${p.image}">
          <div class="tag">
            <b>${p.binder}</b> / Page ${p.page}<br>
            ${p.cards.join(", ")}
          </div>
        </div>
      `;
    }
  });

});
</script>

</body>
</html>
