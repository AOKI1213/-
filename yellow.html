<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yellow Binder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <div class="nav">
      <a class="btn" href="index.html">← Back</a>
      <span class="btn" style="pointer-events:none;">🟡 Yellow Binder</span>
    </div>

    <div class="gallery" id="gallery"></div>

  </div>

<script>
const gallery = document.getElementById("gallery");

// Yellow は 56ページ
for (let i = 1; i <= 56; i++) {

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="yellow/${92 - i}_IMG_0${227 + i}.jpg" loading="lazy">
    <div class="meta">Page ${i} of the Yellow Binder</div>
  `;

  gallery.appendChild(div);
}
</script>

</body>
</html>
