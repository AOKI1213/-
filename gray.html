<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gray Binder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <div class="nav">
      <a class="btn" href="index.html">← Back</a>
      <span class="btn" style="pointer-events:none;">⚪ Gray Binder</span>
    </div>

    <div class="gallery" id="gallery"></div>

  </div>

<script>
const gallery = document.getElementById("gallery");

// Gray は 64ページ
for (let i = 1; i <= 64; i++) {

  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="gray/page ${i} of the gray binder.jpg" loading="lazy">
    <div class="meta">Page ${i} of the Gray Binder</div>
  `;

  gallery.appendChild(div);
}
</script>

</body>
</html>
